<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gemini API 키 발급 가이드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
        h1 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        .step { background: #f8f9fa; border-left: 5px solid #1a73e8; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .warning { background: #fce8e6; border-left: 5px solid #d93025; padding: 15px; border-radius: 4px; color: #a51d24; }
        img { max-width: 100%; height: auto; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h1>🚀 초보자도 1분 만에 끝내는 Gemini API 키 발급 가이드</h1>
    
    <div class="step">
        <h3>1단계: [Gemini API 키 만들기] 버튼 클릭</h3>
        <p>현재 구글 클라우드 콘솔 화면 중앙에 있는 파란색 <strong>[+ Gemini API 키 만들기]</strong> 버튼을 클릭하세요.</p>
        <img src="현재_구글콘솔_화면캡처.png" alt="구글 콘솔 화면 안내">
    </div>

    <div class="step">
        <h3>2단계: 키 복사 및 저장</h3>
        <p>이동한 페이지에서 API 키가 생성되면 <strong>[복사(Copy)]</strong> 버튼을 눌러 메모장에 잘 저장해 두세요.</p>
    </div>

    <div class="warning">
        <strong>⚠️ 주의하세요!</strong><br>
        발급된 API 키는 나만의 비밀번호입니다. 다른 사람에게 절대 공유하지 마세요!
    </div>

</body>
</html>
